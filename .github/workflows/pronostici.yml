name: Calcola pronostici

on:
  schedule:
    - cron: "33 6 * * *"     # ogni mattina (07:33 ora italiana d'inverno, 08:33 d'estate)
    - cron: "7 9-20 * * *"   # ogni ora dalle 10 alle 21 circa: aggiorna formazioni e assenze prima delle partite
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: pronostici
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcola
        run: python -m src.main
      - name: Salva i risultati
        run: |
          git config user.name "pronostici-bot"
          git config user.email "actions@github.com"
          git add docs data
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -m "Pronostici aggiornati $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && break
            sleep 5
          done
