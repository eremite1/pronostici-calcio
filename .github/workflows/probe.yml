name: Prova fonti dati
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe.py > probe_log.txt 2>&1 || true
      - name: Salva i campioni nel ramo probe-data
        run: |
          mkdir /tmp/pd && mv probe_out probe_log.txt /tmp/pd/
          cd /tmp/pd
          git init -q -b probe-data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "campioni"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
